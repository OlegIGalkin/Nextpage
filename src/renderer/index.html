<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nextpage</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <label class="toolbar-field">
          Search Engine
          <select id="search-engine" aria-label="Search Engine"></select>
        </label>
        <label class="toolbar-field">
          AI Chat
          <select id="ai-chat" aria-label="AI Chat"></select>
        </label>
        <button type="button" id="query-to-chat"><span aria-hidden="true">🔍</span> Search Query &gt;&gt; AI Chat</button>
        <button type="button" id="links-to-chat"><span aria-hidden="true">🔗</span> SERP Links &gt;&gt; AI Chat</button>
        <button type="button" id="flip">Flip Panes</button>
        <label class="toolbar-field">
          LLM Language
          <select id="llm-language" aria-label="LLM Language"></select>
        </label>
      </header>
      <div id="split">
        <div class="pane" id="pane-search">
          <webview
            id="search-webview"
            partition="persist:search-engine"
            webpreferences="contextIsolation=yes, nodeIntegration=no"
          ></webview>
        </div>
        <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes">
          <div class="splitter-actions">
            <button type="button" class="splitter-btn" id="splitter-query-to-chat" aria-label="Search Query >> AI Chat" title="Search Query >> AI Chat">🔍</button>
            <button type="button" class="splitter-btn" id="splitter-links-to-chat" aria-label="SERP Links >> AI Chat" title="SERP Links >> AI Chat">🔗</button>
          </div>
          <button type="button" class="splitter-btn fold-btn" id="fold-left" aria-label="Fold left panel">◀</button>
          <button type="button" class="splitter-btn fold-btn" id="fold-right" aria-label="Fold right panel">▶</button>
        </div>
        <div class="pane" id="pane-chat">
          <webview
            id="chat-webview"
            partition="persist:ai-chat"
            allowpopups
            webpreferences="contextIsolation=yes, nodeIntegration=no"
          ></webview>
        </div>
      </div>
      <footer id="status">
        Click a link &gt; add it to AI Chat. Ctrl+Click &gt; open in the external web browser.
      </footer>
    </div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
