appId: com.nextpage.app
productName: Nextpage
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - out/preload/**/*
win:
  icon: build/icon.png
  target:
    - nsis
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nextpage
