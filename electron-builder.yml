appId: com.nextpage.app
productName: Nextpage
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - out/preload/**/*
extraResources:
  - from: LICENSE
    to: LICENSE
win:
  icon: build/icon.png
  target:
    - nsis
  signExecutable: false
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
linux:
  icon: build/icon.png
  category: Utility
  maintainer: Nextpage
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nextpage
